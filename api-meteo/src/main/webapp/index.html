<!doctype html>
<html lang="it">
<head>
    <meta charset="utf-8">
    <!-- senza questa riga il telefono mostrerebbe la pagina rimpicciolita -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SuperMeteo</title>
    <link rel="stylesheet" href="stile.css">
    <!-- defer: lo script parte quando la pagina e' stata letta tutta -->
    <!-- in ordine: i confini, la mappa che li disegna, il grafico, app.js che li usa -->
    <script src="confini.js" defer></script>
    <script src="mappa.js" defer></script>
    <script src="grafico.js" defer></script>
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <!-- il sole e' un disegno: aria-hidden dice ai lettori di schermo di ignorarlo -->
        <svg viewBox="0 0 48 48" aria-hidden="true">
            <circle cx="24" cy="24" r="9" fill="currentColor"/>
            <path d="M24 4v7M24 37v7M4 24h7M37 24h7M9.9 9.9l4.9 4.9M33.2 33.2l4.9 4.9M9.9 38.1l4.9-4.9M33.2 14.8l4.9-4.9"
                  stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/>
        </svg>
        <div>
            <h1>SuperMeteo</h1>
            <p id="stato" role="status">Caricamento...</p>
        </div>
    </header>

    <main>
        <div class="filtri">
            <label>Cerca <input id="cerca" type="search" placeholder="Siena" autocomplete="off"></label>
            <label>Regione
                <select id="regione">
                    <option value="">Tutte</option>
                </select>
            </label>
            <label>Ordina
                <select id="ordine">
                    <option value="nome">Nome</option>
                    <option value="temperatura">Temperatura</option>
                    <option value="vento">Vento</option>
                    <option value="pioggia">Pioggia</option>
                </select>
            </label>
        </div>

        <div class="colonne">
        <section class="cartina" aria-label="Cartina">
            <div id="contenitore-mappa">
                <!-- per chi usa un lettore di schermo gli stessi dati sono nella tabella -->
                <svg id="mappa" viewBox="0 0 726 952" role="img" aria-label="Temperature sulla cartina dell'Italia">
                    <g id="confini"></g>
                    <g id="punti"></g>
                </svg>
                <div id="scheda" hidden></div>
            </div>
            <ul id="legenda" aria-label="Temperatura"></ul>
            <p class="aiuto">Clic su una citt&agrave; per il grafico delle 24 ore.</p>
        </section>

        <section aria-label="Grafico e tabella">
            <div id="dettaglio" hidden>
                <h2 id="titolo-grafico"></h2>
                <p id="lettura" aria-live="polite"></p>
                <svg id="grafico" role="img" aria-labelledby="titolo-grafico"></svg>
                <details>
                    <summary>Tutti i valori</summary>
                    <ul id="valori-grafico"></ul>
                </details>
            </div>
        <div class="tabella">
        <table>
            <thead>
                <tr>
                    <th scope="col">Citt&agrave;</th>
                    <th scope="col" class="numero">&deg;C</th>
                    <th scope="col" class="numero">Vento km/h</th>
                    <th scope="col" class="numero">Pioggia mm</th>
                    <th scope="col" class="numero">Ora</th>
                </tr>
            </thead>
            <!-- le righe le crea app.js -->
            <tbody id="righe"></tbody>
        </table>
        <p id="vuoto" hidden>Nessuna citt&agrave; trovata.</p>
        </div>
        </section>
        </div>
    </main>

    <footer>
        Dati meteo: <a href="https://open-meteo.com/">Open-Meteo.com</a>
        (<a href="https://creativecommons.org/licenses/by/4.0/deed.it">CC BY 4.0</a>).
        Confini: <a href="https://www.istat.it/">ISTAT</a>, tramite
        <a href="https://github.com/guglielmo/geojson-italy">geojson-italy</a> (CC BY 4.0), semplificati.
    </footer>
</body>
</html>
